[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "timdoc-document-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "docxtpl>=0.20,<0.21",
  "jinja2>=3.1,<4",
  "lxml>=5,<7",
  "python-docx>=1.2,<2",
  "timdoc-contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["src/timdoc_document_generator"]

[tool.uv.sources]
timdoc-contracts = { workspace = true }

