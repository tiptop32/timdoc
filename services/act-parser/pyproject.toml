[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "timdoc-act-parser"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pypdf>=5.0,<7", "timdoc-contracts"]

[tool.hatch.build.targets.wheel]
packages = ["src/timdoc_act_parser"]

[tool.uv.sources]
timdoc-contracts = { workspace = true }

