name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --all-packages --extra desktop --extra dev --extra build
      - run: uv run pytest
      - run: uv run pyinstaller packaging/timdoc.spec --clean --noconfirm
      - run: dist\Timdoc\Timdoc.exe --self-test
      - run: Compress-Archive -Path dist\Timdoc -DestinationPath dist\Timdoc-Windows.zip
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Timdoc.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Timdoc-Windows
          path: |
            dist/Timdoc-Windows.zip
            dist/Timdoc-Setup.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Timdoc-Windows
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/Timdoc-Windows.zip
          dist/Timdoc-Setup.exe
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
