name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --all-packages --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src contracts/src services/act-parser/src services/customer-store/src services/document-generator/src
      - run: node --check src/timdoc_app/ui/app.js
      - run: uv run pytest
      - run: uv run pytest -m eval --no-cov
